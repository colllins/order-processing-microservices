services:
  rabbitmq:
    image: rabbitmq:4.3.0-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  order-db:
    image: mysql:9.6
    container_name: order-db
    environment:
      MYSQL_ROOT_PASSWORD: Thisismanmad1@
      MYSQL_DATABASE: order_service_db
    ports:
      - "3308:3306"

  payment-db:
    image: mysql:9.6
    container_name: payment-db
    environment:
      MYSQL_ROOT_PASSWORD: Thisismanmad1@
      MYSQL_DATABASE: payment_service_db
    ports:
      - "3309:3306"

  notification-db:
    image: mysql:9.6
    container_name: notification-db
    environment:
      MYSQL_ROOT_PASSWORD: Thisismanmad1@
      MYSQL_DATABASE: notification_service_db
    ports:
      - "3310:3306"

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - order-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/order_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Thisismanmad1@
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8082:8082"
    depends_on:
      - payment-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://payment-db:3306/payment_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Thisismanmad1@
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8083:8083"
    depends_on:
      - notification-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://notification-db:3306/notification_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Thisismanmad1@
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672