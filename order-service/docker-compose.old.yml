services:
  order-db:
    image: mysql:9.6
    container_name: order-db
    environment:
      MYSQL_ROOT_PASSWORD: Thisismanmad1@
      MYSQL_DATABASE: order_service_db
    ports:
      - "3308:3306"

  rabbitmq:
    image: rabbitmq:4.3.0-management
    container_name: order-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  order-service:
    build: .
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - order-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/order_service_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Thisismanmad1@
      SPRING_RABBITMQ_HOST: order-rabbitmq
      SPRING_RABBITMQ_PORT: 5672