name: Deploy Order Service

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/deploy-order-service.yml"

permissions:
  id-token: write
  contents: read

jobs:
  # STEP 1: Run automated tests
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./order-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: order-service/pom.xml

      - name: Run all tests
        run: mvn clean verify

  # STEP 2: Deploy only if tests pass
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::357542024726:role/GitHubActions-OrderProcessing
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Order Service image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: order-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./order-service
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy Order Service to ECS
        run: |
          aws ecs update-service \
            --cluster order-processing-cluster \
            --service order-service \
            --force-new-deployment \
            --region us-east-1

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster order-processing-cluster \
            --services order-service \
            --region us-east-1